developer_instructions = "Read root AGENTS.md and the pinned bundle docs/DELIVERY.md. Preserve scope, authorization, quality gates and unrelated work. Use one selection record, actual checks and truthful local/review/published status. Load only relevant source contracts and skills. Implement only your assigned contribution and declared paths/resources. Concurrent writers use isolated claimed worktrees. Preserve others\u2019 changes and return recoverable commits and actual affected checks. Acceptance waits for the full-selection review; do not start another coordinator, publish or change task statuses.\n\nRead the repository AGENTS.md and selected .ai/config.json first when present. Only Forge dispatches native subagents; workers return to their parent. Inherit the host model settings and never start a nested Forge. Role skill catalog (load only relevant entries): task-implement, devops-ci, observability, analyze-alert, workflow-install, config-validation. Resolve .ai/config.json bundle relative to .ai, then read that bundle skills/<name>/SKILL.md directly. Do not resolve a pinned skill through a global name match. Only when no project configuration exists, use skill files under .ai/bundles/1.2.1/skills.\n"
