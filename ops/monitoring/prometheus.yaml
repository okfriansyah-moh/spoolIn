global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    environment: local
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 5s
scrape_configs:
  - job_name: spoolin-jvm
    scheme: https
    metrics_path: /actuator/prometheus
    tls_config:
      ca_file: /run/secrets/service-ca
      cert_file: /run/secrets/prometheus-cert
      key_file: /run/secrets/prometheus-key
      min_version: TLS12
    static_configs:
      - targets: ['core:8081']
        labels: {service: core}
      - targets: ['catalog:8081']
        labels: {service: catalog}
      - targets: ['media:8081']
        labels: {service: media}
    sample_limit: 20000
    label_limit: 20
    label_value_length_limit: 256
    body_size_limit: 2MB
  - job_name: spoolin-mcp
    metrics_path: /metrics
    static_configs:
      - targets: ['mcp:8788']
        labels: {service: mcp}
    sample_limit: 1000
    label_limit: 15
    label_value_length_limit: 256
    body_size_limit: 128KB
