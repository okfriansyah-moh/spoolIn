title = "Project secret scan with reviewed hash and prose exceptions"

[extend]
path = ".ai/bundles/1.2.1/profiles/security/gitleaks.toml"

[[allowlists]]
description = "Receipt, service-fingerprint and contract-review SHA-256 values verified independently"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)\.ai/evidence/(run-[0-9a-f]{32}/receipt\.json|t001-round1-receipt-output\.json|t002-self-review\.json)$''',
  '''(^|/)\.ai/evidence/(t003-receipt-command\.log|t003-original-frozen/t003-receipt-command\.log|t003-corrected-receipt-command\.log|t003-corrected-fingerprint\.json)$'''
]
regexes = ['''^\s*"(?:\.ai|\.agents|\.claude|\.cursor|\.github|docs|build-tools)/[^"\r\n]+": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Exact existing brainstorming phrase contains no credential value"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)docs/01-brainstorming-result\.md$''', '''(^|/)\.ai/evidence/t001-round1-gitleaks-analysis\.json$''']
regexes = ['''^credential storage, logout/expiry $''']

[[allowlists]]
description = "Contract generation manifest input and generated-output SHA-256 values"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)build/contract-generation\.json$''']
regexes = ['''^\s*"(?:build-tools/(?:generate-[^"/\r\n]+\.mjs|contracts(?:\.gradle\.kts|/[^"\r\n]+))|contracts/(?:graphql|grpc|json)/[^"\r\n]+|docs/design-system/tokens\.json|gradle/(?:libs\.versions\.toml|verification-metadata\.xml|wrapper/gradle-wrapper\.properties)|package-lock\.json|frontend/src/lib/generated/[^"\r\n]+|mcp/src/generated/[^"\r\n]+|services/core/build/generated/(?:resources/contracts/graphql|sources/graphql/com/spoolin/core/boundary/graphql/generated)/[^"\r\n]+)": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Independently verified Core source snapshot SHA-256 lines in workflow receipts"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)\.ai/evidence/run-[0-9a-f]{32}/receipt\.json$''']
regexes = ['''^\s*"(?:services/core/src/integrationTest/kotlin/com/spoolin/core/recovery/crypto/CredentialIntegrationTest\.kt|services/core/src/main/kotlin/com/spoolin/core/features/crypto/KeyRegistry\.kt|services/core/src/main/kotlin/com/spoolin/core/features/crypto/MountedKeys\.kt|services/core/src/main/kotlin/com/spoolin/core/features/crypto/PasswordHash\.kt|services/core/src/main/kotlin/com/spoolin/core/features/crypto/PasswordHasher\.kt|services/core/src/main/kotlin/com/spoolin/core/features/crypto/PasswordInput\.kt|services/core/src/test/kotlin/com/spoolin/core/features/crypto/PasswordRulesTest\.kt)": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Source snapshot and cache digests in retained workflow provenance records"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)\.ai/evidence/(autonomy-1\.1\.1|harness-running-prompt-doc|release-1\.1\.0|running-prompt-shortcut|task-prompt)/''',
  '''(^|/)\.ai/state/(host-verifications/|account-selection(?:-checkpoint-result)?\.json$)'''
]
regexes = ['''^\s*"(?:cache_key|(?:(?:global|repo):)?(?:skills|tests|\.agents|\.ai|\.claude|\.codex|\.copilot|\.cursor|\.github|docs|build-tools|design-system|plan|services)/[^"\r\n]+)": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Native host call identifiers in retained host-event records, including truncated scanner matches"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = [
  '''(^|/)\.ai/evidence/release-1\.1\.0/native/.*\.json$''',
  '''(^|/)\.ai/state/host-verifications/[^/]+/(pass|fail)-native-smoke\.json$''',
  '''(^|/)\.ai/evidence/autonomy-1\.1\.1/sessions/session-copilot-4e102219/(fresh|resumed)-stdout\.jsonl$'''
]
regexes = ['''^apiCallId\\?":\s*\\?"[A-Za-z0-9+/=_-]+(?:\\?")?$''']

[[allowlists]]
description = "Independently verified shared policy source snapshot SHA-256 lines in workflow receipts"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)\.ai/evidence/run-[0-9a-f]{32}/receipt\.json$''']
regexes = ['''^\s*"(?:libraries/backend-support/src/main/kotlin/com/spoolin/support/policy/ActorKeyRules\.kt|libraries/backend-support/src/test/kotlin/com/spoolin/support/policy/ActorKeyRulesTest\.kt|libraries/backend-support/src/test/kotlin/com/spoolin/support/policy/ConfigurationKeyRulesTest\.kt)": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Verified T010 milestone source fingerprint lines in its immutable summary"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)\.ai/evidence/t010-receipts/development-8b199ad/summary\.json$''']
regexes = ['''^\s*"(?:libraries/backend-support/src/main/kotlin/com/spoolin/support/receipts/(?:ComparisonKeys|ReceiptAccess)\.kt|libraries/backend-support/src/test/kotlin/com/spoolin/support/receipts/ComparisonKeyRulesTest\.kt|services/core/src/main/kotlin/com/spoolin/core/operations/receipts/ComparisonKeySettings\.kt)": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Workflow selection and numbering state input_fingerprint SHA-256 map entries"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)\.ai/evidence/account-selection-final-receipt-output\.json$''',
  '''(^|/)\.ai/evidence/run-[0-9a-f]{32}/receipt\.json$''',
  '''(^|/)\.ai/state/numbering-[^/]+\.json$''',
  '''(^|/)\.ai/state/host-verifications/[^/]+/.*\.json$'''
]
regexes = ['''^\s*"(?:\.agents|\.ai|\.claude|\.cursor|\.github|docs|build-tools|frontend|services|tests|contracts|mcp|plan|gradle|package-lock\.json|node_modules)/[^"\r\n]+": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Full SHA-256 source map entries in retained release and selection provenance"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)docs/release/(remote-obligation-results|remote-acceptance-assessment)\.json$''',
  '''(^|/)\.ai/state/g17-g26-selection-start-result\.json$''',
  '''(^|/)\.ai/state/numbering-(migration-result|resume|registry-before|registry-after-migrate)\.json$''',
  '''(^|/)\.ai/evidence/(account-selection-final-receipt-output\.json|run-[0-9a-f]{32}/receipt\.json)$'''
]
regexes = ['''^\s*"(?:\.ai|\.agents|\.claude|\.cursor|\.github|build-tools|contracts|docs|frontend|gradle|libraries|mcp|ops|services|tests)/[^"\r\n]+": "[0-9a-f]{64}",?\s*$''']
