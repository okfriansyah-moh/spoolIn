name: Remote application acceptance
on:
  workflow_dispatch:
    inputs:
      tested_ref:
        description: Full application SHA to assess
        required: true
        default: '2764ca8bcdb5ee182852e2bdb26c95247c81c5ed'
      mode:
        description: Dependency preparation or strict acceptance
        type: choice
        options: [verify, dependencies, seed, format]
        default: verify
permissions:
  contents: read
concurrency:
  group: movie-app-remote-acceptance
  cancel-in-progress: false
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TESTED_REF: ${{ inputs.tested_ref || github.sha }}
      CI: 'true'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TESTED_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify hosted runner and record assessed inputs
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p artifacts/provenance
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          record = {k: os.environ.get(k) for k in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_ENVIRONMENT', 'ImageOS', 'ImageVersion']}
          record['tested_sha'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          record['platform'] = platform.platform()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TESTED_SHA=' + record['tested_sha'] + '\n')
          Path('artifacts/provenance/runner.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.12+1'
          cache: gradle
      - name: Freeze permitted seed facts
        timeout-minutes: 20
        if: ${{ inputs.mode == 'seed' }}
        run: python3 ops/ci/freeze-wikidata.py
      - name: Prepare npm lock metadata
        if: ${{ inputs.mode == 'dependencies' }}
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked npm dependencies
        id: dependencies
        if: ${{ inputs.mode != 'seed' }}
        run: npm ci
      - name: Prepare dependency locks and verification entries
        if: ${{ (inputs.mode || 'dependencies') == 'dependencies' }}
        run: ./gradlew --no-daemon --console plain --write-verification-metadata sha256 --write-locks resolveLocks
      - name: Prepare source formatting patch
        if: ${{ inputs.mode == 'format' }}
        run: python3 ops/ci/format-selection.py
      - name: Install pinned delivery scanners
        if: ${{ inputs.mode == 'verify' }}
        run: bash ops/ci/install-gates.sh
      - name: Strict build and contract generation
        id: build
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p artifacts/source-checks
          ./gradlew --no-daemon --console plain generateContracts :services:core:bootJar :services:catalog:bootJar :services:media:bootJar 2>&1 | tee artifacts/source-checks/strict-build.log
      - name: Retain failed strict build diagnostics immediately
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/provenance
            artifacts/source-checks/strict-build.log
            **/build/reports/dependency-verification
          retention-days: 14
          if-no-files-found: error
      - name: Check production frontend and MCP
        id: frontend
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p artifacts/source-checks
          npm run check 2>&1 | tee artifacts/source-checks/check.log
          npm run build 2>&1 | tee artifacts/source-checks/build.log
      - name: Production MCP coverage and transport checks
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p artifacts/source-checks
          npm run test:coverage --workspace mcp 2>&1 | tee artifacts/source-checks/mcp-tests.log
      - name: Production frontend behavior checks
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p artifacts/source-checks
          npm run test:coverage --workspace frontend 2>&1 | tee artifacts/source-checks/frontend-tests.log
      - name: Readiness parser and redaction regression checks
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: |
          python3 ops/ci/readiness-helper-test.py
          python3 ops/ci/operational-status-test.py
      - name: Provision pinned production codec prerequisites
        id: codec
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.build.outcome == 'success' }}
        run: bash ops/ci/prepare-codec-fixture.sh
      - name: Retain failed codec prerequisite diagnostics immediately
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.codec.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codec-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/provenance
            artifacts/source-checks/codec-environment.txt
            artifacts/source-checks/codec-sandbox-preflight.log
          retention-days: 14
          if-no-files-found: error
      - name: Exercise real owner and cross-service boundaries
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/source-checks
          ./gradlew --no-daemon --console plain :libraries:backend-support:test :services:core:workIntegrationTest :services:catalog:workIntegrationTest :services:media:workIntegrationTest :services:core:accountIntegrationTest :services:core:draftIntegrationTest :services:core:cryptoIntegrationTest :services:core:receiptIntegrationTest :services:core:alertUnitTest :services:core:mcpGatewayUnitTest :services:core:alertIntegrationTest :services:core:artworkProxyUnitTest :services:core:artworkProxyIntegrationTest :services:media:artworkIntegrationTest :services:catalog:catalogLifecycleIntegrationTest :services:catalog:catalogProposalIntegrationTest :tests:integration:leasesTest :tests:integration:policyIntegrationTest :tests:integration:logicalMetricsTest :tests:integration:artworkIntegrationTest :tests:integration:lifecycleIntegrationTest 2>&1 | tee artifacts/source-checks/production-boundaries.log
      - name: Provision isolated synthetic environment
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.build.outcome == 'success' && steps.frontend.outcome == 'success' }}
        run: |
          python3 ops/ci/prepare-environment.py
      - name: Verify actual Compose policy forwarding
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.build.outcome == 'success' && steps.frontend.outcome == 'success' }}
        run: python3 ops/ci/verify-compose-settings.py
      - name: Install pinned browser engines and trust the isolated CA
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.build.outcome == 'success' && steps.frontend.outcome == 'success' }}
        run: |
          npm exec --workspace tests/browser -- playwright install --with-deps chromium firefox webkit
          sudo apt-get install --no-install-recommends -y libnss3-tools
          sudo cp "$SERVICE_CA_FILE" /usr/local/share/ca-certificates/spoolin-ci.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d sql:"$HOME/.pki/nssdb"
          certutil -A -d sql:"$HOME/.pki/nssdb" -n spoolin-ci -t 'C,,' -i "$SERVICE_CA_FILE"
      - name: Start documented application
        id: application
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.build.outcome == 'success' && steps.frontend.outcome == 'success' }}
        run: bash ops/ci/run-application.sh
      - name: Verify complete loaded seed and restart persistence
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.application.outcome == 'success' }}
        run: python3 ops/ci/verify-seed-runtime.py
      - name: Exercise real production application in browsers
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.application.outcome == 'success' }}
        env:
          NODE_EXTRA_CA_CERTS: ${{ env.SERVICE_CA_FILE }}
        run: npm exec --workspace tests/browser -- playwright test --config playwright.remote.config.ts
      - name: Verify actual operator connector and recovery entry points
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.application.outcome == 'success' }}
        run: python3 ops/ci/verify-operator-commands.py
      - name: Verify actual monitoring and alert persistence
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.application.outcome == 'success' }}
        run: python3 ops/monitoring/verify.py --report artifacts/runtime/monitoring.json
      - name: Verify documented Make lifecycle and suites
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.application.outcome == 'success' }}
        run: bash ops/ci/verify-make-targets.sh
      - name: Verify actual coordinated backup restore and recovery restart
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.application.outcome == 'success' }}
        run: python3 ops/ci/verify-recovery.py
      - name: Retain bounded check reports before delivery gates
        if: ${{ !cancelled() && inputs.mode == 'verify' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/source-checks
            artifacts/runtime
            artifacts/make
            artifacts/recovery
          retention-days: 14
          if-no-files-found: error
      - name: Configured delivery gates
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: python3 .ai/bin/agent-workflow gate --repo . --stage delivery --base 2764ca8bcdb5ee182852e2bdb26c95247c81c5ed
      - name: Retain reports including failed baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/provenance
            artifacts/source-formatting.patch
            artifacts/source-checks
            data/seed/manifest.json
            data/seed/sources
            package-lock.json
            artifacts/runtime
            artifacts/recovery
            artifacts/make
            artifacts/browser
            mcp/coverage
            frontend/coverage
            gradle/verification-metadata.xml
            gradle/locks
            contracts/grpc/gradle.lockfile
            .ai/reports
            **/build/reports/dependency-verification
            **/build/test-results
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
