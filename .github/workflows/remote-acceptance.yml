name: Remote application acceptance
on:
  workflow_dispatch:
    inputs:
      tested_ref:
        description: Full application SHA to assess
        required: true
        default: '2764ca8bcdb5ee182852e2bdb26c95247c81c5ed'
      mode:
        description: Dependency preparation or strict acceptance
        type: choice
        options: [verify, dependencies, seed]
        default: verify
permissions:
  contents: read
concurrency:
  group: movie-app-remote-acceptance
  cancel-in-progress: false
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TESTED_REF: ${{ inputs.tested_ref || github.sha }}
      CI: 'true'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TESTED_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify hosted runner and record assessed inputs
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p artifacts/provenance
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          record = {k: os.environ.get(k) for k in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_ENVIRONMENT', 'ImageOS', 'ImageVersion']}
          record['tested_sha'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          record['platform'] = platform.platform()
          Path('artifacts/provenance/runner.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.12+1'
          cache: gradle
      - name: Freeze permitted seed facts
        if: ${{ inputs.mode == 'seed' }}
        run: python3 ops/ci/freeze-wikidata.py
      - name: Prepare npm lock metadata
        if: ${{ inputs.mode == 'dependencies' }}
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked npm dependencies
        id: dependencies
        if: ${{ inputs.mode != 'seed' }}
        run: npm ci
      - name: Prepare dependency locks and verification entries
        if: ${{ (inputs.mode || 'dependencies') == 'dependencies' }}
        run: ./gradlew --no-daemon --console plain --write-verification-metadata sha256 --write-locks resolveLocks
      - name: Install pinned delivery scanners
        if: ${{ inputs.mode == 'verify' }}
        run: bash ops/ci/install-gates.sh
      - name: Strict build and contract generation
        if: ${{ inputs.mode == 'verify' }}
        run: ./gradlew --no-daemon --console plain generateContracts :services:core:bootJar :services:catalog:bootJar :services:media:bootJar
      - name: Check production frontend and MCP
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: npm run check && npm run build
      - name: Production MCP coverage and transport checks
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: npm run test:coverage --workspace mcp
      - name: Production frontend behavior checks
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: npm run test:coverage --workspace frontend
      - name: Provision isolated synthetic environment
        if: ${{ inputs.mode == 'verify' }}
        run: python3 ops/ci/prepare-environment.py
      - name: Install pinned browser engines and trust the isolated CA
        if: ${{ inputs.mode == 'verify' }}
        run: |
          npm exec --workspace tests/browser -- playwright install --with-deps chromium firefox webkit
          sudo apt-get install --no-install-recommends -y libnss3-tools
          sudo cp "$SERVICE_CA_FILE" /usr/local/share/ca-certificates/spoolin-ci.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d sql:"$HOME/.pki/nssdb"
          certutil -A -d sql:"$HOME/.pki/nssdb" -n spoolin-ci -t 'C,,' -i "$SERVICE_CA_FILE"
      - name: Start documented application
        if: ${{ inputs.mode == 'verify' }}
        run: bash ops/ci/run-application.sh
      - name: Exercise real production application in browsers
        if: ${{ inputs.mode == 'verify' }}
        env:
          NODE_EXTRA_CA_CERTS: ${{ env.SERVICE_CA_FILE }}
        run: npm exec --workspace tests/browser -- playwright test --config playwright.remote.config.ts
      - name: Verify documented Make lifecycle and suites
        if: ${{ inputs.mode == 'verify' }}
        run: bash ops/ci/verify-make-targets.sh
      - name: Configured delivery gates
        if: ${{ !cancelled() && inputs.mode == 'verify' && steps.dependencies.outcome == 'success' }}
        run: python3 .ai/bin/agent-workflow gate --repo . --stage delivery --base 2764ca8bcdb5ee182852e2bdb26c95247c81c5ed
      - name: Retain reports including failed baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/provenance
            data/seed/manifest.json
            data/seed/sources
            package-lock.json
            artifacts/runtime
            artifacts/make
            artifacts/browser
            mcp/coverage
            frontend/coverage
            gradle/verification-metadata.xml
            gradle/locks
            contracts/grpc/gradle.lockfile
            .ai/reports
            **/build/reports/dependency-verification
            **/build/test-results
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
