name: Unit coverage
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unit-coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run complete unit suites and enforce every component's 80% line threshold
        run: make coverage
      - name: Retain coverage and test reports, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-coverage-${{ github.sha }}
          path: .local/unit-coverage/
          include-hidden-files: true
          if-no-files-found: error
      - name: Add measured coverage to the job summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('.local/unit-coverage/summary.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if not path.exists():
                  out.write('Coverage did not finish; inspect the job logs.\n')
              else:
                  report = json.loads(path.read_text())
                  out.write('| Component | Unit line coverage | Result |\n|---|---:|---|\n')
                  for item in report['components']:
                      value = item.get('metrics', {}).get('lines', {}).get('percent')
                      label = 'Unavailable' if value is None else f'{value:.2f}%'
                      out.write(f'| {item["component"]} | {label} | {item["status"]} |\n')
          PY
