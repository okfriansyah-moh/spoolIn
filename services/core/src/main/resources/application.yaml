spring:
  application:
    name: core
  output:
    ansi:
      enabled: never
  main:
    banner-mode: off
    allow-circular-references: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: appdata
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
  ssl:
    bundle:
      pem:
        service:
          keystore:
            certificate: ${SERVICE_CERT_FILE}
            private-key: ${SERVICE_KEY_FILE}
          truststore:
            certificate: ${SERVICE_CA_FILE}
  grpc:
    client:
      channel:
        catalog:
          target: ${CATALOG_GRPC_TARGET:dns:///catalog:9090}
          ssl:
            enabled: true
            bundle: service
          max-inbound-message-size: 17MB
          default:
            deadline: 2s
        media:
          target: ${MEDIA_GRPC_TARGET:dns:///media:9090}
          ssl:
            enabled: true
            bundle: service
          max-inbound-message-size: 17MB
          default:
            deadline: 2s
    server:
      max-inbound-message-size: 17MB
      address: ${GRPC_ADDRESS:0.0.0.0}
      port: ${GRPC_PORT:9090}
      ssl:
        enabled: true
        bundle: service
        client-auth: require
      health:
        enabled: false
server:
  address: ${HTTP_ADDRESS:0.0.0.0}
  port: ${HTTP_PORT:8443}
  ssl:
    enabled: true
    bundle: service
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  server:
    address: ${MANAGEMENT_ADDRESS:0.0.0.0}
    port: ${MANAGEMENT_PORT:8081}
    ssl:
      enabled: true
      bundle: service
      client-auth: need
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,schema,rateReadiness
spoolin:
  schema:
    minimum: '1'
    maximum: '7'

# Operation comparison keys use exact IDs in the native Spring map. For example,
# spoolin.operations.comparison-keys[Old_A]=/run/secrets/operation-old.
# SPRING_APPLICATION_JSON may supply {"spoolin":{"operations":{"comparison-keys":
# {"Old_A":"/run/secrets/operation-old","active":"/run/secrets/operation-active"}}}}.
# Entries merge by exact ID across sources; present invalid values fail validation.
# OPERATION_HMAC_KEY_ID and OPERATION_HMAC_KEY_FILE must select an explicit entry.
# Keep retained mounts for lifetime receipt references and protected backups.
